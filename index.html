<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om Assyl</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'Space Mono', monospace;
  overflow: hidden;
}

/* ── SCREEN 1 ── */
#screen1 {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  gap: 0;
  transition: opacity 0.4s ease;
}
#screen1.fade-out {
  opacity: 0;
  pointer-events: none;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 8vw, 6.5rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1;
  text-align: center;
  margin-bottom: 0.25em;
}

.sub {
  font-size: 0.55rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  margin-bottom: 3rem;
  text-align: center;
}

.grid-10 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 780px;
}
@media (max-width: 580px) {
  .grid-10 { grid-template-columns: repeat(2, 1fr); }
}

.om-btn {
  padding: 1.1rem 0.5rem;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.om-btn span.num {
  font-size: 0.45rem;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.2em;
}
.om-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.4);
  transform: translateY(-3px) scale(1.04);
}
.om-btn:active { transform: scale(0.97); }

/* ── ZOOM LAYER ── */
#zoom-layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
}

.zoom-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  padding: 3rem 6rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  /* start small */
  transform: scale(0.05);
  opacity: 0;
  transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1),
              opacity 0.25s ease;
  backdrop-filter: blur(12px);
}
.zoom-card.zooming {
  transform: scale(1);
  opacity: 1;
}
/* overshoot to full screen */
.zoom-card.explode {
  transform: scale(30);
  opacity: 0;
  transition: transform 0.55s cubic-bezier(0.4, 0, 1, 1),
              opacity 0.35s ease 0.2s;
}

.zoom-text {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 4rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.02em;
}
.zoom-sub {
  font-size: 0.55rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}

/* ── SCREEN 2 ── */
#screen2 {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
#screen2.visible {
  opacity: 1;
  pointer-events: all;
}

.back-btn {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  color: rgba(255,255,255,0.7);
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.55rem 1rem;
  cursor: pointer;
  z-index: 10;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.back-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.35);
  color: #fff;
}

.s2-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3.5rem, 9vw, 7.5rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.03em;
  line-height: 1;
  text-align: center;
  margin-bottom: 0.2em;
}
.s2-sub {
  font-size: 0.55rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  margin-bottom: 2.8rem;
  text-align: center;
}

.grid-12 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 820px;
}
@media (max-width: 580px) {
  .grid-12 { grid-template-columns: repeat(3, 1fr); }
}

.om-btn-2 {
  padding: 1rem 0.5rem;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(16px);
}
.om-btn-2.shown {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.4s ease, transform 0.4s ease,
              background 0.2s, border-color 0.2s, transform 0.18s;
}
.om-btn-2 .dot2 {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
}
.om-btn-2:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.4);
  transform: translateY(-2px) scale(1.03);
}
.om-btn-2:active { transform: scale(0.97); }

/* inner zoom on btn click (screen2) */
.om-btn-2.clicked {
  animation: btnZoom 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes btnZoom {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.25); background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.6); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<!-- SCREEN 1 -->
<div id="screen1">
  <div class="title">Om Assyl</div>
  <div class="sub">— choose an option —</div>
  <div class="grid-10" id="grid10"></div>
</div>

<!-- ZOOM LAYER -->
<div id="zoom-layer">
  <div class="zoom-card" id="zoom-card">
    <div class="zoom-text">Om Assyl</div>
    <div class="zoom-sub" id="zoom-sub">option 1</div>
  </div>
</div>

<!-- SCREEN 2 -->
<div id="screen2">
  <button class="back-btn" onclick="goBack()">← back</button>
  <div class="s2-title">Om Assyl</div>
  <div class="s2-sub">— pick another —</div>
  <div class="grid-12" id="grid12"></div>
</div>

<script>
const screen1   = document.getElementById('screen1');
const screen2   = document.getElementById('screen2');
const zoomLayer = document.getElementById('zoom-layer');
const zoomCard  = document.getElementById('zoom-card');
const zoomSub   = document.getElementById('zoom-sub');
const grid10    = document.getElementById('grid10');
const grid12    = document.getElementById('grid12');

// Build 10 buttons
for (let i = 0; i < 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'om-btn';
  btn.innerHTML = `<span class="num">0${i+1}</span>om assyl`;
  btn.addEventListener('click', () => startZoom(i + 1));
  grid10.appendChild(btn);
}

// Build 12 buttons
for (let i = 0; i < 12; i++) {
  const btn = document.createElement('button');
  btn.className = 'om-btn-2';
  btn.innerHTML = `<span class="dot2"></span>om assyl`;
  btn.addEventListener('click', () => {
    btn.classList.remove('clicked');
    void btn.offsetWidth;
    btn.classList.add('clicked');
  });
  grid12.appendChild(btn);
}

function startZoom(num) {
  zoomSub.textContent = `option ${num}`;

  // show zoom layer
  zoomLayer.style.opacity = '1';
  zoomLayer.style.pointerEvents = 'all';

  // trigger slow zoom in
  requestAnimationFrame(() => {
    zoomCard.classList.remove('explode');
    zoomCard.classList.add('zooming');
  });

  // after card is zoomed in, explode it to fill screen then show screen 2
  setTimeout(() => {
    zoomCard.classList.add('explode');

    setTimeout(() => {
      // switch screens
      screen1.classList.add('fade-out');
      zoomLayer.style.opacity = '0';
      zoomLayer.style.pointerEvents = 'none';
      screen2.classList.add('visible');

      // stagger the 12 buttons in
      const btns = grid12.querySelectorAll('.om-btn-2');
      btns.forEach((b, i) => {
        b.classList.remove('shown');
        b.classList.remove('clicked');
        setTimeout(() => b.classList.add('shown'), 80 + i * 55);
      });

      // reset zoom card for next time
      setTimeout(() => {
        zoomCard.classList.remove('zooming', 'explode');
      }, 600);

    }, 450);
  }, 1200);
}

function goBack() {
  screen2.classList.remove('visible');
  screen1.classList.remove('fade-out');

  // reset btn2 states
  grid12.querySelectorAll('.om-btn-2').forEach(b => {
    b.classList.remove('shown', 'clicked');
  });
}
</script>
</body>
</html>
