<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i'm sorry my bro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'Space Mono', monospace;
  overflow: hidden;
}

#screen1 {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  transform-origin: center center;
  transition: none;
  will-change: transform, opacity;
}

#screen1.zooming {
  transition: transform 1.4s cubic-bezier(0.12, 0, 0.2, 1),
              opacity 0.4s ease 1.1s;
  transform: scale(12);
  opacity: 0;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 5vw, 4.5rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.02em;
  text-align: center;
  margin-bottom: 0.25em;
}

.sub {
  font-size: 0.52rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  margin-bottom: 2.8rem;
  text-align: center;
}

.grid-10 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 820px;
}
@media (max-width: 580px) {
  .grid-10 { grid-template-columns: repeat(2, 1fr); }
}

.om-btn {
  padding: 1.1rem 0.5rem;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.om-btn .num {
  font-size: 0.42rem;
  color: rgba(255,255,255,0.22);
  letter-spacing: 0.2em;
}
.om-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.38);
  transform: translateY(-3px) scale(1.05);
}
.om-btn.picked {
  background: rgba(255,255,255,0.18);
  border-color: #fff;
  box-shadow: 0 0 30px rgba(255,255,255,0.18);
  transform: scale(1.08);
}

#screen2 {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.08);
  transform-origin: center center;
  transition: none;
  will-change: transform, opacity;
}
#screen2.reveal {
  transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  transform: scale(1);
  opacity: 1;
  pointer-events: all;
}

.back-btn {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  color: rgba(255,255,255,0.6);
  font-family: 'Space Mono', monospace;
  font-size: 0.52rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.55rem 1rem;
  cursor: pointer;
  z-index: 10;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.back-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
  color: #fff;
}

.s2-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 5rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.03em;
  text-align: center;
  margin-bottom: 0.2em;
}
.s2-sub {
  font-size: 0.52rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  margin-bottom: 2.5rem;
  text-align: center;
}

.grid-12 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 820px;
}
@media (max-width: 580px) {
  .grid-12 { grid-template-columns: repeat(3, 1fr); }
}

.om-btn-2 {
  padding: 1rem 0.5rem;
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(14px);
  transition: background 0.2s, border-color 0.2s, transform 0.18s;
}
.om-btn-2 .dot2 {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}
.om-btn-2.shown {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.45s ease, transform 0.45s ease, background 0.2s, border-color 0.2s;
}
.om-btn-2:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.38);
  transform: translateY(-2px) scale(1.04);
}
</style>
</head>
<body>

<div id="screen1">
  <div class="title">i'm sorry my bro</div>
  <div class="sub">— choose an option —</div>
  <div class="grid-10" id="grid10"></div>
</div>

<div id="screen2">
  <button class="back-btn" onclick="goBack()">← back</button>
  <div class="s2-title">i'm sorry my bro</div>
  <div class="s2-sub">— pick another —</div>
  <div class="grid-12" id="grid12"></div>
</div>

<script>
const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const grid10  = document.getElementById('grid10');
const grid12  = document.getElementById('grid12');

for (let i = 0; i < 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'om-btn';
  btn.innerHTML = `<span class="num">0${i+1}</span>i'm sorry my bro`;
  btn.addEventListener('click', () => zoomIntoBtn(btn, i + 1));
  grid10.appendChild(btn);
}

for (let i = 0; i < 12; i++) {
  const btn = document.createElement('button');
  btn.className = 'om-btn-2';
  btn.innerHTML = `<span class="dot2"></span>i'm sorry my bro`;
  grid12.appendChild(btn);
}

function zoomIntoBtn(btn) {
  if (screen1.classList.contains('zooming')) return;
  btn.classList.add('picked');

  const rect = btn.getBoundingClientRect();
  const originX = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
  const originY = ((rect.top + rect.height / 2) / window.innerHeight) * 100;

  screen1.style.transformOrigin = `${originX}% ${originY}%`;
  screen2.style.transformOrigin = `${originX}% ${originY}%`;

  requestAnimationFrame(() => screen1.classList.add('zooming'));

  setTimeout(() => {
    screen1.style.display = 'none';
    screen2.classList.add('reveal');

    const btns = grid12.querySelectorAll('.om-btn-2');
    btns.forEach((b, i) => {
      b.classList.remove('shown');
      setTimeout(() => b.classList.add('shown'), 100 + i * 55);
    });
  }, 1350);
}

function goBack() {
  screen2.classList.remove('reveal');
  screen2.style.transition = 'none';
  screen2.style.transform = 'scale(0.08)';
  screen2.style.opacity = '0';
  screen2.style.pointerEvents = 'none';

  screen1.style.display = '';
  screen1.style.transition = 'none';
  screen1.style.transform = 'scale(1)';
  screen1.style.opacity = '1';
  screen1.classList.remove('zooming');

  grid10.querySelectorAll('.om-btn').forEach(b => b.classList.remove('picked'));
  grid12.querySelectorAll('.om-btn-2').forEach(b => b.classList.remove('shown'));

  requestAnimationFrame(() => {
    screen1.style.transition = '';
    setTimeout(() => { screen2.style.transition = ''; }, 50);
  });
}
</script>
</body>
</html>
